spring.application.name=conformia

# Credenciais vêm do .env (fora do Git). Modelo em .env.example
spring.config.import=optional:file:.env[.properties]

# Banco
spring.datasource.url=jdbc:postgresql://localhost:5432/conformia
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA: quem cria/altera tabelas é o Flyway; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Usuário inicial: a migration V1 lê estes valores (placeholders do Flyway)
# Colchetes preservam o "_" na chave do mapa
spring.flyway.placeholders.[admin_nome]=${ADMIN_NOME:Administrador}
spring.flyway.placeholders.[admin_email]=${ADMIN_EMAIL}
spring.flyway.placeholders.[admin_senha]=${ADMIN_SENHA}

# Sessão expira após 30 min sem uso (vale para web e app)
server.servlet.session.timeout=30m
# Cookie de sessão não vai em POST vindo de outro site (proteção extra de CSRF, ver SecurityConfig)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Thymeleaf: sem cache para ver mudanças de tela sem reiniciar
spring.thymeleaf.cache=false
