spring.application.name=conformia

# Credenciais vêm do .env (fora do Git). Modelo em .env.example
spring.config.import=optional:file:.env[.properties]

# Banco
spring.datasource.url=jdbc:postgresql://localhost:5432/conformia
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA: quem cria/altera tabelas é o Flyway; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Thymeleaf: sem cache para ver mudanças de tela sem reiniciar
spring.thymeleaf.cache=false
